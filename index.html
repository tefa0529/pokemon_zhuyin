      "zy": "ㄔㄨㄤˋ ㄗㄠˋ ㄅㄠˇ ㄎㄜˇ ㄇㄥˋ"
    },
    "abilities": [
      {
        "word": "多屬性",
        "zy": "ㄉㄨㄛ ㄕㄨˇ ㄒㄧㄥˋ"
      }
    ]
  }
];

function padNum(id) {
  return String(id).padStart(3, '0');
}

function makeRuby(word, zyStr) {
  const zys = zyStr.split(' ');
  const chars = Array.from(word);
  let html = '<span class="ruby-group">';
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i];
    const z = zys[i] || '';
    html += '<span class="ruby-pair"><span class="rt-zy">' + z + '</span><span class="rb-char">' + c + '</span></span>';
  }
  html += '</span>';
  return html;
}

let currentPokemons = [];

function showZhuyinRepresentative() {
  currentPokemons = zhuyinRepresentatives.map((p) => {
    return {
      id: p.id,
      name: p.name,
      zhuyin: p.zhuyin,
      symbol: p.symbol,
      types: p.types,
      category: p.category,
      abilities: p.abilities,
      img: 'https://assets.pokemon.com/assets/cms2/img/pokedex/full/' + padNum(p.id) + '.png'
    };
  });
  renderCards();
}

function generateRandomPokemon() {
  const maxId = parseInt(document.getElementById('maxIdInput').value) || 200;
  const clampedMax = Math.min(Math.max(maxId, 12), 500);
  document.getElementById('maxIdInput').value = clampedMax;

  const selectedIds = new Set();
  while (selectedIds.size < 12) {
    const randomId = Math.floor(Math.random() * clampedMax) + 1;
    selectedIds.add(randomId);
  }

  currentPokemons = Array.from(selectedIds).map(id => {
    const rep = zhuyinRepresentatives.find(r => r.id === id);
    if (rep) {
      return {
        id: id,
        name: rep.name,
        zhuyin: rep.zhuyin,
        symbol: rep.symbol,
        types: rep.types,
        category: rep.category,
        abilities: rep.abilities,
        img: 'https://assets.pokemon.com/assets/cms2/img/pokedex/full/' + padNum(id) + '.png'
      };
    }
    return {
      id: id,
      name: '寶可夢 #' + id,
      zhuyin: 'ㄅㄠˇ ㄎㄜˇ ㄇㄥˋ',
      img: 'https://assets.pokemon.com/assets/cms2/img/pokedex/full/' + padNum(id) + '.png'
    };
  });

  renderCards();
}

function toggleDetails(index) {
  const panel = document.getElementById('details-' + index);
  const btn = document.getElementById('expand-btn-' + index);
  if (!panel) return;
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
    btn.innerHTML = '📖 詳細資訊 ▼';
  } else {
    panel.classList.add('open');
    btn.innerHTML = '📕 收回資訊 ▲';
  }
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';

  const labelType = makeRuby('屬性', 'ㄕㄨˇ ㄒㄧㄥˋ');
  const labelCategory = makeRuby('分類', 'ㄈㄣ ㄌㄟˋ');
  const labelAbility = makeRuby('特性', 'ㄊㄜˋ ㄒㄧㄥˋ');

  currentPokemons.forEach((p, index) => {
    const card = document.createElement('div');
    card.className = 'card';

    let detailsHtml = '';
    if (p.types && p.category && p.abilities) {
      const typesRendered = p.types.map(t => '<span class="val-badge">' + makeRuby(t.word, t.zy) + '</span>').join('');
      const categoryRendered = '<span class="val-badge">' + makeRuby(p.category.word, p.category.zy) + '</span>';
      const abilitiesRendered = p.abilities.map(a => '<span class="val-badge">' + makeRuby(a.word, a.zy) + '</span>').join('');

      detailsHtml = 
        '<button id="expand-btn-' + index + '" class="expand-btn" onclick="toggleDetails(' + index + ')">📖 詳細資訊 ▼</button>' +
        '<div id="details-' + index + '" class="details-panel">' +
          '<div class="info-row">' +
            '<span class="label-tag">' + labelType + '：</span>' + typesRendered +
          '</div>' +
          '<div class="info-row">' +
            '<span class="label-tag">' + labelCategory + '：</span>' + categoryRendered +
          '</div>' +
          '<div class="info-row">' +
            '<span class="label-tag">' + labelAbility + '：</span>' + abilitiesRendered +
          '</div>' +
        '</div>';
    }

    card.innerHTML = 
      '<div class="poke-num">No. ' + padNum(p.id) + '</div>' +
      (p.symbol ? '<div class="symbol-badge">' + p.symbol + '</div>' : '') +
      '<img src="' + p.img + '" alt="' + p.name + '" onerror="this.src=\'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + p.id + '.png\'">' +
      '<div class="poke-name">' + p.name + '</div>' +
      '<div class="zhuyin-box">' +
        p.zhuyin.split(' ').map(s => '<span class="zhuyin-tag">' + s + '</span>').join('') +
      '</div>' +
      detailsHtml;

    grid.appendChild(card);
  });
}

// Default to showing 37 representative list on load
showZhuyinRepresentative();
</script>
